<!DOCTYPE html>
<html>
<head>
    <title>Add Patient</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(160deg, #1e2a78, #4c2a85);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 360px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 32px;
        }
        h1 { margin: 0 0 24px; font-size: 22px; color: #fff; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        input:focus { outline: none; border-color: #a78bfa; }
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #4f9cf9, #a855f7);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        .back {
            display: block;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>New patient</h1>
        <form method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="tel" name="phone" placeholder="+15615739624" required>
            <button type="submit">Add patient</button>
        </form>
        <a class="back" href="/">← back</a>
    </div>
</body>
</html>
